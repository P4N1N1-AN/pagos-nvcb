<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>Pagos NV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pagos NV">
<style>
  html,body{margin:0;height:100%;background:#0f5c4d;overflow:hidden}
  #carga{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    color:#fff;font:600 16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  #carga img{width:96px;height:96px;border-radius:22px}
  #carga a{color:#fff;background:rgba(255,255,255,.18);padding:10px 16px;border-radius:10px;text-decoration:none}
  #carga small{opacity:.8;font-weight:400;max-width:320px}
</style>
</head>
<body>
<div id="carga">
  <img src="icon-192.png" alt="">
  <div id="msg">Cargando pagos…</div>
</div>
<script>
  // ⬇⬇ URL DE TU APP WEB DE APPS SCRIPT (la que termina en /exec) ⬇⬇
  const URL_APP = 'https://script.google.com/macros/s/AKfycbxZs0cYcrJycnTGwjSXcpn_gA2DZ8h_JrcXnvc14MX5VaJCJa52Y3tSQB2Hp8NMy7Wh2A/exec';

  const carga = document.getElementById('carga'), msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_APP)) {
    msg.innerHTML = 'Falta pegar la URL de Apps Script en <b>index.html</b> (línea URL_APP).';
  } else {
    // ¿Se abrió desde el ícono de la pantalla de inicio?
    const instalada = window.navigator.standalone === true ||
                      window.matchMedia('(display-mode: standalone)').matches;
    if (instalada) {
      // Desde el ícono: abre directamente los pagos.
      msg.textContent = 'Abriendo pagos…';
      setTimeout(() => location.replace(URL_APP), 400);
    } else {
      // Desde Safari: se queda aquí para instalarla con el logo correcto.
      msg.innerHTML = 'Pagos NV<br><small>Para instalarla en el iPhone: toca <b>Compartir</b> y luego <b>Agregar a pantalla de inicio</b>.</small>';
      const a = document.createElement('a'); a.href = URL_APP; a.textContent = 'Abrir pagos';
      carga.appendChild(a);
    }
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
